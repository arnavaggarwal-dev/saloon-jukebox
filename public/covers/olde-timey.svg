    <polygon points="258.0,201.0 259.7,205.6 264.7,205.8 260.8,208.9 262.1,213.7 258.0,210.9 253.9,213.7 255.2,208.9 251.3,205.8 256.3,205.6" fill="#7A2E2A"/>
    <polygon points="382.0,201.0 383.7,205.6 388.7,205.8 384.8,208.9 386.1,213.7 382.0,210.9 377.9,213.7 379.2,208.9 375.3,205.8 380.3,205.6" fill="#7A2E2A"/>

