name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci


      - name: Build
        env:
          # Project-scoped Pages URL, e.g. /saloon-jukebox/
          # These are the PUBLIC anon credentials — they ship in the bundle by
          # design and are safe with the RLS policies in supabase/migrations/.
          # Without them the app shows a setup message instead of the jukebox.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # The database stores relative media paths; this is what lets the
          # built single file find the audio from anywhere.
          VITE_MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Assemble the site
        # dist/index.html is the whole app in one file; the media sits beside it
        # so VITE_MEDIA_BASE resolves. .nojekyll stops Pages stripping files.
        run: |
          cp -r music covers dist/
          cp favicon.svg dist/
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
